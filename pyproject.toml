[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "similar-customer-miner"
version = "2.0.0rc6"
description = "Kimi Code Skill: mine similar B2B buyers from a list of high-value customers"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Similar Customer Miner Team"}
]
keywords = ["b2b", "sales", "customs", "tradewind", "lead-generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pandas>=2.0.0",
    "tabulate>=0.9.0",
    "openpyxl>=3.1.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "rapidfuzz>=3.5.0",
    "beautifulsoup4>=4.12.0",
    "comtradeapicall>=1.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[project.scripts]
similar-customer-miner = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*", "tools*"]
